name: Flutter CI

on:
  push:
    branches: [main, claude/ecstatic-fermat-vnc5t5]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: cratetrack_ng

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build_android:
    name: Build Android APK (debug)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug-apk
          path: cratetrack_ng/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build_ios:
    name: Build iOS (no codesign)
    needs: analyze_and_test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
